<script>
(() => {
  // Decorative petals are drawn in a palette that complements each slide.
  const palettes = {
    cream: ['#f6e8c6','#d8b879','#fff7e7'],
    gold: ['#d6a54f','#f0cf87','#e7b8a8'],
    teal: ['#d9b5b0','#d5bd83','#e8d7b5'],
    pink: ['#e9a4ad','#f4c9cf','#d7b978']
  };
  document.querySelectorAll('.petal-slide').forEach((section, idx) => {
    const canvas = document.createElement('canvas');
    canvas.className = 'petal-layer';
    section.appendChild(canvas);
    const ctx = canvas.getContext('2d');
    let w=0,h=0,petals=[];
    const palette=palettes[section.dataset.palette]||palettes.cream;
    function resize(){
      const r=section.getBoundingClientRect(),dpr=Math.min(2,window.devicePixelRatio||1);
      w=r.width;h=r.height;canvas.width=Math.round(w*dpr);canvas.height=Math.round(h*dpr);
      ctx.setTransform(dpr,0,0,dpr,0,0);
      petals=Array.from({length:Math.max(12,Math.min(30,Math.round(w/28)))},()=>({
        x:Math.random()*w,y:Math.random()*h, size:3+Math.random()*5,
        speed:.45+Math.random()*1.1, drift:(Math.random()-.5)*.7,
        rot:Math.random()*Math.PI*2, spin:(Math.random()-.5)*.035,
        color:palette[Math.floor(Math.random()*palette.length)],
        shape:Math.random()
      }));
    }
    resize();window.addEventListener('resize',resize);
    function frame(){
      ctx.clearRect(0,0,w,h);
      for(const p of petals){
        p.y+=p.speed;p.x+=Math.sin(p.y*.012+idx)*.55+p.drift;p.rot+=p.spin;
        if(p.y>h+12){p.y=-12;p.x=Math.random()*w;}
        if(p.x<-12)p.x=w+12;if(p.x>w+12)p.x=-12;
        ctx.save();ctx.translate(p.x,p.y);ctx.rotate(p.rot);ctx.fillStyle=p.color;ctx.globalAlpha=.82;
        ctx.beginPath();ctx.ellipse(0,0,p.size*.58,p.size,0,0,Math.PI*2);ctx.fill();ctx.restore();
      }
      requestAnimationFrame(frame);
    }
    requestAnimationFrame(frame);
  });
  const ticket=document.getElementById('codedTicket');
  const canvas=document.getElementById('scratchCanvas');
  const ctx=canvas.getContext('2d',{willReadFrequently:true});
  let drawing=false,last=null,cleared=false;
  function setup(){
    if(cleared)return;
    const r=ticket.getBoundingClientRect(),dpr=Math.max(1,window.devicePixelRatio||1);
    canvas.width=Math.round(r.width*dpr);canvas.height=Math.round(r.height*dpr);
    ctx.setTransform(dpr,0,0,dpr,0,0);
    const g=ctx.createLinearGradient(0,0,r.width,r.height);
    g.addColorStop(0,'#ead8a6');g.addColorStop(.48,'#c9ac6c');g.addColorStop(1,'#e8d4a0');
    ctx.globalCompositeOperation='source-over';ctx.fillStyle=g;ctx.fillRect(0,0,r.width,r.height);
    ctx.fillStyle='rgba(255,250,230,.26)';
    for(let x=0;x<r.width;x+=10)for(let y=0;y<r.height;y+=9)ctx.fillRect(x+Math.random()*2,y+Math.random()*2,1,1);
    ctx.fillStyle='#173f43';ctx.textAlign='center';ctx.textBaseline='middle';
    ctx.font='600 '+Math.max(11,Math.min(18,r.height*.19))+'px Georgia';
    ctx.fillText('SCRATCH TO REVEAL',r.width/2,r.height/2);
    ctx.globalCompositeOperation='destination-out';
  }
  function point(e){const r=canvas.getBoundingClientRect();return{x:e.clientX-r.left,y:e.clientY-r.top};}
  function scratch(e){
    const p=point(e);
    ctx.beginPath();
    if(last){ctx.moveTo(last.x,last.y);ctx.lineTo(p.x,p.y);ctx.lineWidth=28;ctx.lineCap='round';ctx.lineJoin='round';ctx.stroke();}
    ctx.arc(p.x,p.y,14,0,Math.PI*2);ctx.fill();last=p;
    const pixels=ctx.getImageData(0,0,canvas.width,canvas.height).data;let clear=0,total=0;
    for(let i=3;i<pixels.length;i+=4*12){total++;if(pixels[i]<30)clear++;}
    if(clear/total>.42&&!cleared){cleared=true;canvas.style.transition='opacity .4s';canvas.style.opacity='0';setTimeout(()=>canvas.style.display='none',450);}
  }
  canvas.addEventListener('pointerdown',e=>{drawing=true;last=null;canvas.setPointerCapture(e.pointerId);scratch(e);});
  canvas.addEventListener('pointermove',e=>{if(drawing)scratch(e);});
  const stop=()=>{drawing=false;last=null;};
  canvas.addEventListener('pointerup',stop);canvas.addEventListener('pointercancel',stop);
  setup();window.addEventListener('resize',setup);
  const tapOpen=document.getElementById('tapOpen');
  const openingVideo=document.getElementById('openingVideo');
  const openingOverlay=document.getElementById('openingVideoSlide');
  const startNote=document.getElementById('videoStartNote');
  document.body.classList.add('waiting-to-open');
  const backgroundSong=document.getElementById('backgroundSong');
  tapOpen.addEventListener('click',()=>{
    openingVideo.currentTime=0;
    backgroundSong.volume=0.8;
    backgroundSong.play().catch(()=>{});
    openingVideo.play().then(()=>{
      tapOpen.style.display='none';
      startNote.style.display='none';
    }).catch(()=>{
      tapOpen.style.display='block';
      tapOpen.style.visibility='visible';
      startNote.textContent='Tap to Open';
      startNote.style.display='block';
    });
  });
  openingVideo.addEventListener('playing',()=>{tapOpen.style.display='none';startNote.style.display='none';});
  openingVideo.addEventListener('ended',()=>{
    openingOverlay.classList.add('video-finished');
    document.body.classList.remove('waiting-to-open');
    setTimeout(()=>{openingOverlay.style.display='none';},700);
  });
  // Other slides play only while visible; the opening video is intentionally played once.
  const videos=[...document.querySelectorAll('video:not(#openingVideo)')];
  if('IntersectionObserver'in window){
    const observer=new IntersectionObserver(entries=>entries.forEach(entry=>{
      if(entry.isIntersecting)entry.target.play().catch(()=>{});else entry.target.pause();
    }),{threshold:.35});
    videos.forEach(v=>observer.observe(v));
  }
})();
</script>
